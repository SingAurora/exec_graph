app:
  host: 127.0.0.1
  # HTTP 监听端口。
  port: 8080
  # 登录会话的有效期，单位为小时；168 表示 7 天。
  session_ttl_hours: 168
  # 允许访问 API 的前端来源，生产环境填写实际 HTTPS 域名。
  allowed_origins:
    - http://localhost:5173

database:
  host: 127.0.0.1
  port: 3306
  # MySQL schema/database name used by the application.
  schema: exec_graph
  user: root
  password: replace-with-local-password
  # MySQL 连接字符集；建议保持 utf8mb4，以支持完整 Unicode。
  charset: utf8mb4

redis:
  host: 127.0.0.1
  # Redis 服务端口。
  port: 6379
  password: replace-with-local-redis-password
  database: 0

credentials:
  access_key_id: replace-with-local-access-key-id
  access_key_secret: replace-with-local-access-key-secret

mail:
  region: ap-guangzhou
  template_id: 29256
  # 邮件验证码的有效期，单位为分钟。
  code_ttl_minutes: 10
  from_email: replace-with-verified-sender

storage:
  region: ap-guangzhou
  bucket: exec-graph-1253847355
  # COS 中存放个人资料媒体的对象键前缀，末尾保留 /。
  avatar_prefix: avatars/

security:
  # 用 `openssl rand -base64 32` 生成；生产环境建议通过
  # EXEC_GRAPH_CREDENTIAL_ENCRYPTION_KEY 注入。
  credential_encryption_key: replace-with-base64-encoded-32-byte-key
